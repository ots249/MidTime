<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="grad-pill-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2B4" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
    <linearGradient id="grad-pill-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Circle (White / Crisp) -->
  <circle cx="256" cy="256" r="240" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Outer Ring with Gradient -->
  <circle cx="256" cy="216" r="150" fill="none" stroke="url(#grad-ring)" stroke-width="24" stroke-linecap="round" stroke-dasharray="840" stroke-dashoffset="140" />

  <!-- Clock Center & Hands -->
  <circle cx="256" cy="216" r="10" fill="#1E3A8A" />
  <!-- Minute Hand -->
  <line x1="256" y1="216" x2="330" y2="160" stroke="#1E3A8A" stroke-width="12" stroke-linecap="round" />
  <!-- Hour Hand -->
  <line x1="256" y1="216" x2="200" y2="170" stroke="#1E3A8A" stroke-width="12" stroke-linecap="round" />

  <!-- Hour Ticks -->
  <circle cx="256" cy="96" r="6" fill="#1E3A8A" />
  <circle cx="376" cy="216" r="6" fill="#1E3A8A" />
  <circle cx="136" cy="216" r="6" fill="#1E3A8A" />
  <circle cx="341" cy="131" r="5" fill="#0284C7" />
  <circle cx="171" cy="131" r="5" fill="#00A896" />

  <!-- Medicine Capsule Pill (Tilted 35 deg at bottom) -->
  <g transform="translate(256, 300) rotate(-35)">
    <!-- Pill Left Half (Teal) -->
    <path d="M -80,-36 L 0,-36 L 0,36 L -80,36 C -100,36 -116,20 -116,0 C -116,-20 -100,-36 -80,-36 Z" fill="url(#grad-pill-left)" />
    <!-- Pill Right Half (Blue) -->
    <path d="M 0,-36 L 80,-36 C 100,-36 116,-20 116,0 C 116,20 100,36 80,36 L 0,36 Z" fill="url(#grad-pill-right)" />
    <!-- Center Dividing Line -->
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#FFFFFF" stroke-width="4" />
    <!-- Pill Highlight -->
    <path d="M -70,-22 L 70,-22" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.35" />
  </g>

  <!-- MidTime Wordmark (Optional Bottom Branding) -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="800" text-anchor="middle" fill="#1E3A8A">
    <tspan fill="#00A896">Mid</tspan>Time
  </text>
  <!-- Sprout Leaf on 'i' -->
  <path d="M 218,390 C 218,380 230,375 238,375 C 238,385 226,390 218,390 Z" fill="#00A896" />
  <path d="M 238,375 C 246,375 254,380 254,390 C 246,390 238,385 238,375 Z" fill="#00A896" />
  <!-- Subtitle -->
  <text x="256" y="472" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0284C7" letter-spacing="1">
    — MEDICINE SCHEDULE COMPANION —
  </text>
</svg>
